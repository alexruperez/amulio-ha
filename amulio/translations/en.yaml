configuration:
  public_url:
    name: Public URL for Stremio
    description: Reachable LAN or HTTPS origin used in Stremio manifests and playback links. Never use the Home Assistant Ingress URL.
  peer_tcp_port:
    name: aMule peer TCP port
    description: Advanced eD2K daemon TCP listener. Network exposes its optional mapping separately; exposure does not prove router, NAT, or WAN accessibility.
  peer_udp_port:
    name: Kad UDP port
    description: Advanced Kad daemon UDP listener. Network exposes its optional mapping separately; exposure does not prove router, NAT, or WAN accessibility.
  preferred_languages:
    name: Preferred metadata languages
    description: Comma-separated language codes, for example en,es.
  allow_season_packs:
    name: Allow season packs
    description: Include TV season packs in matching download candidates.
  max_results:
    name: Maximum results
    description: Maximum number of candidates aMulio returns to Stremio per search.
  max_file_size_gb:
    name: Maximum file size (GB)
    description: Exclude candidates above this size. Use 0 for no limit.
  show_stream_size:
    name: Show file size
    description: Include file size in Stremio playback choices.
  show_stream_sources:
    name: Show source availability
    description: Include known sources or download availability in Stremio.
  show_stream_language:
    name: Show detected language
    description: Include the detected language in Stremio playback choices.
  show_stream_technical_details:
    name: Show codec, HDR and release group
    description: Include file technical details in Stremio playback choices.
network:
  8000/tcp: Stremio addon and playback endpoint. Enable only when clients can reach the configured public URL.
  4662/tcp: Optional aMule eD2K peer TCP port.
  4672/udp: Optional aMule Kad UDP port.
