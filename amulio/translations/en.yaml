configuration:
  public_url:
    name: Public URL for Stremio
    description: Reachable LAN or HTTPS origin used in Stremio manifests and playback links. Never use the Home Assistant Ingress URL.
  peer_tcp_port:
    name: aMule peer TCP port
    description: TCP listener used for eD2K peer connectivity. Enable its network port separately if you want inbound peers.
  peer_udp_port:
    name: Kad UDP port
    description: UDP listener used for Kad connectivity. Enable its network port separately if you want inbound peers.
  preferred_languages:
    name: Preferred metadata languages
    description: Comma-separated language codes, for example en,es.
  allow_season_packs:
    name: Allow season packs
    description: Include TV season packs in matching download candidates.
network:
  8000/tcp: Stremio addon and playback endpoint. Enable only when clients can reach the configured public URL.
  4662/tcp: Optional aMule eD2K peer TCP port.
  4672/udp: Optional aMule Kad UDP port.
